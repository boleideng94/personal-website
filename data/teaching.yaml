# Add another entry here to list a new teaching tool.
- title: "Final Project: Build Your Roadster"
  feature: roadster
  category: Georgia Tech · AE 2220 · Dynamics
  description: Start on the road. Take flight. Build from wheel forces to thrusters, flips, and full three-dimensional dynamics.
  url: /teaching/build-your-own-roadster/

- title: Kinematics in Motion
  label: Kinematics in Motion
  category: Rigid-body kinematics
  description: Bring textbook problems to life with nine interactive examples. Explore moving linkages, rolling wheels, and rotating bodies, and see how velocity and acceleration change at every point.
  url: /teaching/kinematics-in-motion/
  image: /images/teaching/kinematics-in-motion.svg
  topics:
    - Velocity & acceleration
    - Linkages & rolling motion
    - 2D & 3D kinematics
  activity: Choose an example, press Play, and follow a point on the moving body. Pause at any instant to inspect its velocity and acceleration, then change the inputs to see what happens.

- title: Rocket Launch Game
  label: Ignition Lab
  category: Rockets & momentum
  description: Build a rocket, choose your propellant, and steer your payload into an unpowered orbit. Explore how thrust, mass, and fuel choices shape your flight and its cost.
  url: /teaching/rocket-launch-game/
  image: /images/teaching/rocket-launch.svg
  topics:
    - Momentum & thrust
    - Rocket propulsion
    - Orbital motion
  activity: Launch your rocket and turn gradually toward the horizon. Cut the engine to test whether your orbit holds, then try reaching orbit with less propellant.

- title: Satellite Orbit Simulator
  label: Orbit Lab
  category: Orbital mechanics
  description: Take the controls of a satellite. Change its velocity, preview a maneuver, and watch its orbit evolve around Earth in three dimensions.
  url: /teaching/satellite-orbit-simulator/
  image: /images/teaching/orbit-lab.svg
  topics:
    - Orbital motion
    - Velocity changes
    - 3D visualization
  activity: Start with a circular orbit, try a prograde burn, and see how the path changes. Switch to the 3D view to explore a maneuver out of the orbital plane.

- title: Cycling Pacing Game
  label: Pacing Lab
  category: Mechanics & energy
  description: Take on a hilly cycling course—or import your own GPX and choose a segment. Control your power, manage your energy reserve, and discover how pacing changes your finish time.
  url: /teaching/cycling-pacing-game/
  image: /images/teaching/cycling-pacing.svg
  topics:
    - Forces & motion
    - Power & energy
    - Pacing strategies
  activity: Ride once at a steady 330 W, then try pushing harder on climbs and coasting downhill. Compare your finish times and watch how your energy reserve recovers.

- title: Downhill Traction Game
  label: Apex Lab
  category: Friction & cornering
  description: Race down a winding descent with one control—the brake lever. Balance braking and cornering within the available tire grip, and find your fastest clean run.
  url: /teaching/downhill-traction-game/
  image: /images/teaching/downhill-traction.svg
  topics:
    - Tire friction
    - Braking forces
    - Cornering dynamics
  activity: Try braking before a bend, then compare with braking during the turn. Watch the traction circle to see how braking and cornering share the same grip limit.
