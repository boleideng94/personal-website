# Add another entry here to list a new teaching tool.
- title: Satellite Orbit Simulator
  label: Orbit Lab
  category: Orbital mechanics
  description: Take the controls of a satellite. Change its velocity, preview a maneuver, and watch its orbit evolve around Earth in three dimensions.
  url: /teaching/satellite-orbit-simulator/
  image: /images/teaching/orbit-lab.svg
  topics:
    - Orbital motion
    - Velocity changes
    - 3D visualization
  activity: Start with a circular orbit, try a prograde burn, and see how the path changes. Switch to the 3D view to explore a maneuver out of the orbital plane.

- title: Cycling Pacing Game
  label: Pacing Lab
  category: Mechanics & energy
  description: Take on a hilly cycling course—or import your own GPX and choose a segment. Control your power, manage your energy reserve, and discover how pacing changes your finish time.
  url: /teaching/cycling-pacing-game/
  image: /images/teaching/cycling-pacing.svg
  topics:
    - Forces & motion
    - Power & energy
    - Pacing strategies
  activity: Ride once at a steady 330 W, then try pushing harder on climbs and coasting downhill. Compare your finish times and watch how your energy reserve recovers.
